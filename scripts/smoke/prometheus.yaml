global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: smoke-node
    static_configs:
      - targets: ['exporter:9100']
        labels:
          origin: observed
          # Intentionally no cluster label: exercises Monitoring's configured default.
  - job_name: smoke-monitoring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['monitoring:8080']
